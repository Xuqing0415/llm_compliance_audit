name: Bug 报告
description: 提交一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告。请尽量提供可复现信息；涉及敏感数据的问题请改走 SECURITY.md 的私有披露渠道，不要粘贴真实数据。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 标签或 commit（如 v0.1.0 / 644d5e0）
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      options:
        - 请求/响应拦截（proxy）
        - 检测规则（tier1/tier2/tier3）
        - 审计日志（audit）
        - 管理接口（admin）
        - 配置与热重载
        - 部署（docker/k8s）
        - 其他
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 配置片段、请求体（脱敏）、命令与期望/实际行为
      placeholder: |
        1. 启动网关并配置 ...
        2. 发送请求 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为（含日志/返回码）
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: OS / Go 版本 / 部署方式
      placeholder: Windows 11 / go1.22 / docker compose
name: 功能建议
description: 提出一个新功能或改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先搜下现有 Issue 避免重复。涉及 tier2/tier3 集成的大功能请先描述设计思路。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在什么场景下缺什么能力
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 行为、配置项或 API 形态，越具体越好
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 你尝试过的其它办法或配置
  - type: dropdown
    id: priority
    attributes:
      label: 对你的重要程度
      options:
        - 阻塞（没有它无法上线）
        - 高（尽快需要）
        - 中（锦上添花）
        - 低（以后再说）
    validations:
      required: true